<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPAC | Team Predator AC</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#f5f7fb;font-family:Arial,Helvetica,sans-serif}
.container{width:min(900px,92%);margin:auto}
header{padding:20px 0;border-bottom:1px solid #18385a;background:#050b14}
.brand{display:flex;align-items:center;gap:15px}
.logo{width:65px;height:65px;object-fit:contain;border-radius:14px;background:#ffb800}
.brand h1{margin:0;font-size:25px;letter-spacing:1px}
.gold{color:#ffb800}
.hero{text-align:center;padding:55px 0 35px}
.hero .eyebrow{color:#55aaff;letter-spacing:4px;font-weight:700;font-size:13px}
.hero h2{font-size:clamp(45px,10vw,82px);margin:12px 0 8px;line-height:.95}
.hero p{color:#9eafc2;font-size:17px}
.roster{display:grid;grid-template-columns:1fr;gap:15px;padding-bottom:20px}
.player{position:relative;padding:27px 28px;border:1px solid #24527e;border-radius:18px;background:linear-gradient(110deg,#0d1d30,#091321);box-shadow:0 8px 25px #0004}
.player:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;background:#ffb800;border-radius:4px}
.role{color:#55aaff;font-size:14px;font-weight:800;letter-spacing:3px;margin-left:10px}
.name{font-size:32px;font-weight:800;margin:9px 0 0 10px}
.social{margin:45px 0 35px;padding:28px 15px;text-align:center;border-top:1px solid #18385a;border-bottom:1px solid #18385a}
.social h3{margin:0 0 18px;color:#ffb800;letter-spacing:2px}
.social a{display:inline-block;margin:6px;padding:12px 16px;border:1px solid #315575;border-radius:10px;color:#fff;text-decoration:none}
.social a:hover{border-color:#ffb800;color:#ffb800}
footer{text-align:center;color:#6f8196;padding:0 0 30px}
@media(min-width:650px){.roster{grid-template-columns:1fr 1fr}.player:first-child{grid-column:span 2}}
</style>
</head>
